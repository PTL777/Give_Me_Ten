<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Give Me 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1: #FFD6E8;
    --bg2: #A0E9FF;
    --cream: #FFFDF7;
    --ink: #4A3F55;
    --pink: #FFB3C6;
    --purple: #C9B6FF;
    --turquoise: #9BE8DC;
    --yellow: #FFE18A;
    --orange: #FFC896;
    --green: #B4EAB0;
    --gold: #FFB44F;
    --muted: rgba(74,63,85,0.65);
  }

  *{ box-sizing: border-box; }

  html{
    height:100%;
  }

  html, body{
    margin:0;
    padding:0;
    background: linear-gradient(160deg, #FF6FA5 0%, #FFAF40 30%, #4FE3C1 65%, #6A5AE0 100%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    justify-content:flex-start;
  }

  .wrap{
    max-width: 560px;
    width:100%;
    margin: 0 auto;
    padding: clamp(6px, 2vh, 12px) clamp(8px, 3vw, 16px) 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-sizing:border-box;
  }

  .board{
    width:100%;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(4px, 2vw, 10px);
  }

  .timer-badge{
    font-family:'Baloo 2', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: #FFFFFF;
    background: linear-gradient(135deg, #4FC3F7, #7C6BFF);
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: background .2s ease, transform .2s ease;
    flex-shrink: 0;
  }

  .timer-badge.urgent{
    background: linear-gradient(135deg, #FF5252, #FF8A65);
    animation: timerPulse 0.5s ease-in-out infinite;
  }

  @keyframes timerPulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.12); }
  }

  .tile{
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border: 3px solid transparent;
    color: var(--ink);
    user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    box-shadow: 0 10px 16px rgba(0,0,0,0.35), inset -10px -12px 22px rgba(0,0,0,0.38), inset 6px 8px 12px rgba(255,255,255,0.3);
    transition: transform .12s ease, border-color .12s ease, opacity .3s ease, box-shadow .12s ease;
    overflow:hidden;
    position:relative;
    perspective: 280px;
  }

  .ball-face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }

  .ball-face::before{
    content:'';
    position:absolute;
    top:6%;
    left:12%;
    width:42%;
    height:26%;
    background: radial-gradient(ellipse at 35% 35%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.75) 30%, rgba(255,255,255,0) 75%);
    border-radius: 50%;
    filter: blur(0.5px);
  }

  .ball-face::after{
    content:'';
    position:absolute;
    top:20%;
    left:6%;
    width:16%;
    height:44%;
    background: linear-gradient(200deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%);
    border-radius: 50%;
    transform: rotate(-18deg);
  }

  .ball-number{
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #F5F3EE 65%, #E2DED4 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.25), 0 3px 4px rgba(0,0,0,0.2);
    z-index: 1;
  }

  .tile .num{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(38px, 15vw, 52px);
    color: #1A1A1A;
    display:inline-block;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.6), -1px -1px 1px rgba(0,0,0,0.4);
    transition: opacity .15s ease, transform .3s ease;
  }

  .tile .num.rotated{ transform: rotate(90deg); }
  .tile .num.blink-hidden{ opacity: 0; }

  .tile:active{ transform: scale(0.94); }

  .tile.c0{ background: radial-gradient(circle at 32% 28%, #F16460 0%, #E0201C 55%, #8C0F0C 100%); }
  .tile.c1{ background: radial-gradient(circle at 32% 28%, #2A2A2E 0%, #131315 60%, #000000 100%); }
  .tile.c2{ background: radial-gradient(circle at 32% 28%, #FFE873 0%, #F4C419 55%, #B8890A 100%); }
  .tile.c3{ background: radial-gradient(circle at 32% 28%, #5FC0F0 0%, #1C8FD6 55%, #0B5C93 100%); }
  .tile.c4{ background: radial-gradient(circle at 32% 28%, #7CDB8E 0%, #2FA84A 55%, #17692A 100%); }
  .tile.c5{ background: radial-gradient(circle at 32% 28%, #C98CE8 0%, #9B4FC7 55%, #601F87 100%); }

  .tile.nil{
    background: repeating-linear-gradient(135deg, #F1EEF5, #F1EEF5 10px, #E7E2ED 10px, #E7E2ED 20px);
    border-style: dashed;
    border-color: rgba(74,63,85,0.3);
  }
  .tile.nil .ball-number{ background: rgba(255,255,255,0.6); }
  .tile.nil .num{
    color: rgba(74,63,85,0.55);
    font-weight: 700;
  }

  .tile.selected{
    border-color: #FF8FAE;
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 0 0 4px rgba(255,143,174,0.35);
  }

  .tile.correct{
    border-color: #7ED9A8;
    box-shadow: 0 0 0 5px rgba(126,217,168,0.5), 0 0 20px rgba(126,217,168,0.6);
    transform: scale(1.1);
  }

  .tile.wrong{
    border-color: #FF8FAE;
    animation: shake .35s ease;
  }

  .tile.cleared{
    pointer-events: none;
  }

  .tile.hint{
    animation: hintpulse 1s ease-in-out infinite;
  }

  @keyframes hintpulse{
    0%, 100%{ box-shadow: 0 0 0 5px #FFFFFF, 0 0 0 9px #14151A, 0 3px 0 rgba(0,0,0,0.06); }
    50%{ box-shadow: 0 0 0 8px #FFFFFF, 0 0 0 13px #14151A, 0 3px 0 rgba(0,0,0,0.06); }
  }

  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-5px); }
    75%{ transform: translateX(5px); }
  }

  .hint-text{
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    text-align:center;
    min-height: 18px;
  }

  @media (max-height: 700px){
    .wrap{ padding-top: 4px; padding-bottom: 2px; }
    .hint-text{ margin-top: 6px; min-height: 12px; }
    .board{ gap: clamp(3px, 1.5vw, 7px); }
  }

  .bottom-bar{
    width:100%;
    max-width: 560px;
    margin: 0 auto;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.6);
    border-top: 2px solid rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
  }

  .equation-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
  }

  .controls-row{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 16px;
  }

  .level-chip{
    font-family:'Baloo 2', sans-serif;
    font-weight:900;
    font-size: 17px;
    color: #FFFFFF;
    background: linear-gradient(135deg, #FF6B35, #FF2D78);
    border: 2px solid rgba(255,255,255,0.9);
    padding: 9px 14px;
    border-radius: 999px;
    white-space:nowrap;
    flex-shrink: 0;
    text-shadow: 0 2px 0 rgba(0,0,0,0.2);
    box-shadow: 0 4px 10px rgba(255,45,120,0.5), 0 0 0 3px rgba(255,107,53,0.35);
  }

  .level-chip span{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width: 34px;
    height: 34px;
    padding: 0 6px;
    margin-left: 5px;
    border-radius: 999px;
    background: #FF6A00;
    color: #FFFFFF;
    font-size: 22px;
    font-weight: 900;
    text-shadow: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.35);
  }

  .level-chip span.level-total{
    display:inline;
    min-width: 0;
    height: auto;
    padding: 0;
    margin-left: 2px;
    border-radius: 0;
    background: none;
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 700;
    box-shadow: none;
    opacity: 0.85;
  }



  .target-chip{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    line-height:1;
  }

  .equation-symbol{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 38px;
    color: var(--ink);
  }

  .pick-slot{
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border: 3px dashed rgba(74,63,85,0.35);
    background: rgba(255,255,255,0.5);
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 32px;
    color: rgba(74,63,85,0.4);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }

  .pick-slot.filled{
    border-style: solid;
    border-color: rgba(255,255,255,0.7);
    color: #FFFFFF;
    transform: scale(1.05);
    box-shadow: 0 3px 6px rgba(0,0,0,0.2), inset 2px 2px 4px rgba(255,255,255,0.4), inset -2px -3px 5px rgba(0,0,0,0.25);
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5), -1px -1px 1px rgba(0,0,0,0.35);
  }

  .pick-slot.filled.nil{
    background: repeating-linear-gradient(135deg, #F1EEF5, #F1EEF5 6px, #E7E2ED 6px, #E7E2ED 12px);
    color: rgba(74,63,85,0.6);
    text-shadow:none;
  }

  .pick-slot.filled.c0{ background: radial-gradient(circle at 32% 28%, #F16460 0%, #E0201C 55%, #8C0F0C 100%); }
  .pick-slot.filled.c1{ background: radial-gradient(circle at 32% 28%, #2A2A2E 0%, #131315 60%, #000000 100%); }
  .pick-slot.filled.c2{ background: radial-gradient(circle at 32% 28%, #FFE873 0%, #F4C419 55%, #B8890A 100%); color:#1A1A1A; text-shadow: none; }
  .pick-slot.filled.c3{ background: radial-gradient(circle at 32% 28%, #5FC0F0 0%, #1C8FD6 55%, #0B5C93 100%); }
  .pick-slot.filled.c4{ background: radial-gradient(circle at 32% 28%, #7CDB8E 0%, #2FA84A 55%, #17692A 100%); }
  .pick-slot.filled.c5{ background: radial-gradient(circle at 32% 28%, #C98CE8 0%, #9B4FC7 55%, #601F87 100%); }

  .target-chip .value{
    width: 98px;
    height: 98px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 35% 30%, #FF6B6B 0%, #E5383B 55%, #B22222 100%);
    border: 5px solid #14151A;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18), 0 8px 16px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }

  .value-inner{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 38px;
    color: #14151A;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #FFFFFF;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08);
  }

  .hint-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:900;
    font-size: 16px;
    background: linear-gradient(135deg, #FFD166, #FF8FAE);
    border: none;
    color: var(--ink);
    padding: 11px 18px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    transition: transform .12s ease;
    white-space:nowrap;
    flex-shrink: 0;
  }

  .replay-btn{
    background: linear-gradient(135deg, #9BE8DC, #7ED9A8);
  }
  .hint-btn:hover{ transform: translateY(-1px) scale(1.03); }
  .hint-btn:active{ transform: translateY(1px); }
  .hint-btn:disabled{ opacity: 0.5; cursor:default; transform:none; }

  .overlay{
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 38%, #FFE787 0%, #FFB84D 30%, #FF6FA5 62%, #8B4FE0 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap: 6px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
    z-index: 10;
    padding: 24px;
    text-align:center;
    overflow:hidden;
  }

  .overlay::before{
    content:'';
    position:absolute;
    inset: -30%;
    background: repeating-conic-gradient(rgba(255,255,255,0.22) 0deg 6deg, transparent 6deg 18deg);
    animation: spinRays 14s linear infinite;
    pointer-events:none;
  }

  @keyframes spinRays{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  .central-icon{
    position:absolute;
    top:50%;
    left:50%;
    font-size: clamp(100px, 34vw, 180px);
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events:none;
  }

  .central-icon:empty{ display:none; }

  .central-icon svg{
    width: 1em;
    height: 1em;
    display:block;
  }

  .central-icon.birds-sun{
    top: 66%;
  }

  .shooting-star{
    position:absolute;
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 100%);
    border-radius: 2px;
    z-index: 2;
    animation-name: shootStar;
    animation-timing-function: ease-in;
    animation-iteration-count: 1;
    opacity: 0;
  }

  @keyframes shootStar{
    0%{ transform: translate(0,0) rotate(-28deg); opacity: 0; }
    12%{ opacity: 1; }
    80%{ opacity: 1; }
    100%{ transform: translate(260px, 140px) rotate(-28deg); opacity: 0; }
  }

  .central-icon.spin-glow{
    animation: sunSpin 7s linear infinite, sunPulse 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 28px rgba(255,215,0,0.85));
  }

  .central-icon.glow-float{
    animation: moonFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 0 26px rgba(190,210,255,0.85));
  }

  .central-icon.bounce-in{
    animation: rainbowBounce .6s cubic-bezier(.34,1.56,.64,1) both;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.2));
  }

  @keyframes sunSpin{
    from{ transform: translate(-50%, -50%) rotate(0deg); }
    to{ transform: translate(-50%, -50%) rotate(360deg); }
  }

  @keyframes sunPulse{
    0%, 100%{ opacity: 0.8; }
    50%{ opacity: 1; }
  }

  @keyframes moonFloat{
    0%, 100%{ transform: translate(-50%, -50%) translateY(0); }
    50%{ transform: translate(-50%, -50%) translateY(-12px); }
  }

  @keyframes rainbowBounce{
    0%{ transform: translate(-50%, -50%) scale(0); }
    70%{ transform: translate(-50%, -50%) scale(1.15); }
    100%{ transform: translate(-50%, -50%) scale(1); }
  }

  .jackpot-icons{
    font-size: clamp(32px, 9vw, 46px);
    display:flex;
    gap: 14px;
    margin-bottom: 6px;
    position: relative;
    z-index: 5;
  }

  .jackpot-icons span{ display:inline-block; }

  .overlay.show{
    opacity:1;
    pointer-events:auto;
  }

  .confetti{
    position:absolute;
    font-size: 46px;
    animation-timing-function: ease-out;
    animation-iteration-count: 1;
    opacity:0;
    will-change: transform, opacity;
    z-index: 2;
  }

  .confetti.mode-burst{ top:50%; left:50%; animation-name: burstOut; }
  .confetti.mode-candy{ animation-name: candyMove; animation-timing-function: ease-in-out; }
  .confetti.mode-twinkle{ animation-name: twinkleAnim; }
  .confetti.mode-fly{ animation-name: flyAcross; }
  .confetti.mode-floatup{ animation-name: floatUp; }

  .jackpot-icons span{
    display:inline-block;
    animation: iconBounce 0.8s ease-in-out infinite;
  }

  .jackpot-icons span:nth-child(2){ animation-delay: .15s; }
  .jackpot-icons span:nth-child(3){ animation-delay: .3s; }

  @keyframes iconBounce{
    0%, 100%{ transform: translateY(0) scale(1); }
    50%{ transform: translateY(-10px) scale(1.15); }
  }

  .level-line{
    color: #FFFFFF;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    font-size: 14px;
    font-weight: 600;
    position: relative;
    z-index: 5;
  }

  @keyframes burstOut{
    0%{ transform: translate(-50%, -50%) scale(0); opacity: 0; }
    18%{ opacity: 1; transform: translate(calc(-50% + var(--bx) * 0.3), calc(-50% + var(--by) * 0.3)) scale(1.25); }
    75%{ opacity: 1; }
    100%{ transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(0.5); opacity: 0; }
  }

  @keyframes candyMove{
    0%{ transform: translateY(var(--startY, 0)) scale(0.6); opacity: 0; }
    12%{ opacity: 1; transform: translateY(calc(var(--startY, 0) * 0.85)) scale(1.1); }
    80%{ opacity: 1; transform: translateY(calc(var(--startY, 0) * 0.08)) scale(1); }
    100%{ transform: translateY(0) scale(0); opacity: 0; }
  }

  @keyframes twinkleAnim{
    0%{ opacity: 0; transform: scale(0.4); }
    45%{ opacity: 1; transform: scale(1.1); }
    100%{ opacity: 0; transform: scale(0.4); }
  }

  @keyframes flyAcross{
    0%{ transform: translateX(0) translateY(0) scaleY(1); opacity: 0; }
    10%{ opacity: 1; transform: translateX(10vw) translateY(-6px) scaleY(0.8); }
    25%{ transform: translateX(32vw) translateY(-18px) scaleY(1); }
    40%{ transform: translateX(48vw) translateY(-8px) scaleY(0.8); }
    55%{ transform: translateX(64vw) translateY(-18px) scaleY(1); }
    70%{ transform: translateX(82vw) translateY(-8px) scaleY(0.8); }
    90%{ opacity: 1; transform: translateX(112vw) translateY(-14px) scaleY(1); }
    100%{ transform: translateX(130vw) translateY(0) scaleY(1); opacity: 0; }
  }

  @keyframes eagleBlink{
    0%, 100%{ filter: brightness(1); }
    50%{ filter: brightness(1.9) drop-shadow(0 0 6px rgba(255,255,255,0.85)); }
  }

  .confetti.mode-static-blink{
    position:absolute;
    animation-name: eagleStaticBlink;
    animation-timing-function: ease-in-out;
  }

  @keyframes eagleStaticBlink{
    0%{ opacity: 0; transform: scale(0.6); filter: brightness(1); }
    10%{ opacity: 1; transform: scale(1); }
    25%{ filter: brightness(1); }
    38%{ filter: brightness(2.1) drop-shadow(0 0 8px rgba(255,255,255,0.9)); }
    50%{ filter: brightness(1); }
    63%{ filter: brightness(2.1) drop-shadow(0 0 8px rgba(255,255,255,0.9)); }
    78%{ filter: brightness(1); }
    90%{ opacity: 1; }
    100%{ opacity: 0; transform: scale(0.9); }
  }

  @keyframes floatUp{
    0%{ transform: translateY(0) scale(0.6); opacity: 0; }
    20%{ opacity: 1; transform: translateY(-10vh) scale(1); }
    100%{ transform: translateY(-58vh) scale(0.85); opacity: 0; }
  }

  .overlay .big{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(46px, 14vw, 74px);
    color: #FFFDE7;
    text-shadow: 0 0 12px rgba(255,215,0,0.9), 0 0 26px rgba(255,111,165,0.7), 0 4px 0 rgba(0,0,0,0.25);
    letter-spacing: 1px;
    animation: pop .4s cubic-bezier(.34,1.56,.64,1), jackpotPulse 0.9s ease-in-out .4s infinite;
    position: relative;
    z-index: 5;
    margin-top: -20vh;
  }

  @keyframes pop{
    0%{ transform: scale(0.3); opacity:0; }
    70%{ transform: scale(1.2); opacity:1; }
    100%{ transform: scale(1); }
  }

  @keyframes jackpotPulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.1); }
  }

  .overlay .big.finale{
    font-size: clamp(30px, 10vw, 52px);
    max-width: 90vw;
    overflow-wrap: break-word;
    word-break: break-word;
    text-align: center;
    color: #FFE449;
    -webkit-text-stroke: 2px #6B1030;
    text-shadow: 0 0 4px #6B1030, 0 0 20px rgba(255,60,90,0.95), 0 0 40px rgba(255,170,0,0.9), 0 4px 0 rgba(0,0,0,0.35);
    animation: pop .5s cubic-bezier(.34,1.56,.64,1), finalePulse 1.1s ease-in-out .5s infinite;
  }

  @keyframes finalePulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.06); }
  }

  .central-icon.finale-crown{

<script>
(function(){
  const TILE_COUNT = 24;
  const COLOR_CLASSES = ['c0','c1','c2','c3','c4','c5'];
  const PRAISE = ['Awesome!', 'Excellent!', 'Amazing!', 'Brilliant!', 'Outstanding!', 'Marvelous!', 'Spectacular!', 'Fantastic!', 'Well done!', 'Impressive!', 'Superb!', 'Magnificent!'];
  const HEART_SVG = '<svg viewBox="0 0 24 24" width="1.55em" height="1.55em" style="vertical-align:-0.55em;display:inline-block;overflow:visible;"><defs><radialGradient id="glowGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFD98F" stop-opacity="0.4"/><stop offset="100%" stop-color="#FFD98F" stop-opacity="0"/></radialGradient><radialGradient id="ballGrad" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#FFB4A8"/><stop offset="55%" stop-color="#EE5F52"/><stop offset="100%" stop-color="#C33A2E"/></radialGradient><linearGradient id="heartGrad2" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#FFF4F7"/><stop offset="100%" stop-color="#FFC7DA"/></linearGradient><filter id="ballShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0.2" dy="0.5" stdDeviation="0.7" flood-color="#000000" flood-opacity="0.22"/></filter><filter id="heartShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0.1" dy="0.25" stdDeviation="0.4" flood-color="#B0134F" flood-opacity="0.25"/></filter></defs><circle cx="12" cy="12" r="13.5" fill="url(#glowGrad)"/><circle cx="12" cy="12" r="11" fill="url(#ballGrad)" filter="url(#ballShadow)"/><ellipse cx="8.3" cy="7.5" rx="3.6" ry="1.9" fill="#FFFFFF" opacity="0.22" transform="rotate(-28 8.3 7.5)"/><path d="M12 17.6 C12 17.6 5 13.1 5 8.8 C5 6.2 7 4.4 9.3 4.4 C10.7 4.4 11.6 5.1 12 5.8 C12.4 5.1 13.3 4.4 14.7 4.4 C17 4.4 19 6.2 19 8.8 C19 13.1 12 17.6 12 17.6 Z" fill="url(#heartGrad2)" stroke="#E08BAA" stroke-width="0.7" stroke-linejoin="round" filter="url(#heartShadow)"/><ellipse cx="9" cy="7.8" rx="1.3" ry="0.8" fill="#FFFFFF" opacity="0.65" transform="rotate(-25 9 7.8)"/></svg>';
  const CROWN_SVG = '<svg viewBox="0 0 100 84" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF3C4"/><stop offset="50%" stop-color="#FFCB3E"/><stop offset="100%" stop-color="#D98A00"/></linearGradient><linearGradient id="crownBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFE58A"/><stop offset="100%" stop-color="#C77E00"/></linearGradient><filter id="crownDrop" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#6B3F00" flood-opacity="0.45"/></filter><linearGradient id="gemRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF9FAE"/><stop offset="55%" stop-color="#E23B4E"/><stop offset="100%" stop-color="#8E1526"/></linearGradient><linearGradient id="gemWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="55%" stop-color="#DCEBFF"/><stop offset="100%" stop-color="#9FBEE0"/></linearGradient><linearGradient id="gemGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A6F0BE"/><stop offset="55%" stop-color="#28A65A"/><stop offset="100%" stop-color="#0F5C2E"/></linearGradient></defs><g filter="url(#crownDrop)"><path d="M12,60 L20,24 L35,42 L50,15 L65,42 L80,24 L88,60 Z" fill="url(#crownGold)" stroke="#A8650A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="10" y="58" width="80" height="17" rx="6" fill="url(#crownBand)" stroke="#A8650A" stroke-width="2.5"/></g><rect x="46.5" y="-2" width="7" height="17" rx="1.5" fill="#FFE9A8" stroke="#A8650A" stroke-width="1.2"/><rect x="40" y="4" width="20" height="7" rx="1.5" fill="#FFE9A8" stroke="#A8650A" stroke-width="1.2"/></svg>';

  const BLESSINGS = [
    { text: 'JESUS ' + HEART_SVG + ' me', ref: 'John 15:9' },
    { text: 'Hallelujah, Praise the LORD', ref: 'Psalm 150:6' },
    { text: 'JESUS is Good all the time', ref: 'Psalm 100:5' },
    { text: 'The LORD is my Shepherd', ref: 'Psalm 23:1' },
    { text: 'JESUS is my Rock and Salvation', ref: 'Psalm 62:6' },
    { text: 'JESUS is with me all the time', ref: 'Matthew 28:20' },
    { text: 'JESUS is my Redeemer', ref: 'Galatians 3:13' },
    { text: 'JESUS is my Saviour', ref: 'Luke 2:11' },
    { text: 'The LORD is my Refuge', ref: 'Psalm 91:2' },
    { text: 'JESUS is my King of Kings', ref: 'Revelation 19:16' },
    { text: 'JESUS is my Healer and Protector', ref: 'Psalm 103:3–4' },
    { text: 'Be Still and know JESUS is LORD', ref: 'Psalm 46:10' },
    { text: 'JESUS will never leave me nor forsake me', ref: 'Hebrews 13:5' },
    { text: 'The LORD is Gracious, and Full of Compassion', ref: 'Psalm 145:8' },
    { text: 'The LORD has great plans for me', ref: 'Jeremiah 29:11' },
    { text: 'JESUS is the Light of the World', ref: 'John 8:12' },
    { text: 'JESUS is the Lamb of God', ref: 'John 1:29' },
    { text: 'JESUS is my Bright Morning Star', ref: 'Revelation 22:16' }
  ];

  // Five celebration themes that take turns across levels
  const THEMES = [
    {
      name: 'candy',
      bg: 'radial-gradient(circle at 50% 38%, #FFE787 0%, #FFB84D 30%, #FF6FA5 62%, #8B4FE0 100%)',
      textColor: '#FFFDE7',
      topIcons: ['🍬', '🎈', '🍭'],
      icon: null, iconClass: '',
      mode: 'candy',
      particles: ['🍬', '🍭', '🎈', '❤️', '💕', '💖']
    },
    {
      name: 'sun',
      bg: 'radial-gradient(circle at 50% 32%, #FFF4C2 0%, #FFD54F 35%, #FF9800 75%, #E65100 100%)',
      textColor: '#FFFDE7',
      topIcons: ['🙌', '✨', '🌟'],
      icon: '☀️', iconClass: 'spin-glow',
      mode: 'burst',
      particles: ['✨', '⭐', '🌟', '💫', '☀️']
    },
    {
      name: 'rainbow',
      bg: 'linear-gradient(180deg, #A0E9FF 0%, #D9F7FF 50%, #FFFFFF 100%)',
      textColor: '#3A1E5E',
      topIcons: ['🌈', '☁️', '✨'],
      icon: '🌈', iconClass: 'bounce-in',
      mode: 'floatup',
      particles: ['☁️', '✨', '⭐']
    }
  ];

  let level = 1;
  let target, min, max;
  let values = [];       // number or null (nil tile)
  let selected = [];
  let locked = false;
  let hintTimeout = null;
  let blinkTimers = [];  // active setTimeout ids for blinking numbers
  let autoAdvanceTimeout = null;
  let moveInterval = null;
  let numSpans = [];      // numSpans[idx] -> the .num element currently showing values[idx]
  let countdownInterval = null;
  let timeLeft = 15;

  // Time limit per level, index 0 = level 1. null means no time limit.
  const TIME_TABLE = [
    null, 55, 40, 30, 20, 15, 10,           // levels 1-7   (angle only)
    55, 45, 35, 25, 20, 19, 17, 15,         // levels 8-15  (angle + blink)
    55, 45, 35, 25, 20, 19, 17, 15,         // levels 16-23 (angle + move)
    50, 45, 35, 25, 20, 17, 15              // levels 24-30 (angle + move)
  ];

  function getTimeLimit(lv){
    return TIME_TABLE[lv - 1];
  }

  const STORAGE_KEY = 'give-me-10-level-v2';

  function saveProgress(lv){
    try {
      localStorage.setItem(STORAGE_KEY, String(lv));
    } catch (e) {
      // storage unavailable (private browsing, sandboxed preview, etc.) — game still works, just won't persist
    }
  }

  function loadProgress(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const n = parseInt(raw, 10);
      if (!Number.isInteger(n) || n < 1) return 1;
      return Math.min(n, MAX_LEVEL);
    } catch (e) {
      return 1;
    }
  }

  const boardEl = document.getElementById('board');
  const levelNumEl = document.getElementById('levelNum');
  const targetValueEl = document.getElementById('targetValue');
  const hintTextEl = document.getElementById('hintText');
    const overlayEl = document.getElementById('overlay');
  const overlayBigEl = document.getElementById('overlayBig');
  const overlaySubEl = document.getElementById('overlaySub');

  function randInt(a, b){
    return Math.floor(Math.random() * (b - a + 1)) + a;
  }

  function shuffledIndices(n){
    const arr = Array.from({length: n}, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--){
      const j = randInt(0, i);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const MAX_LEVEL = 30;

  // Fixed multiset that always makes exactly 10 pairs summing to 10:
  // two 1s, two 9s, three 2s, three 8s, two 3s, two 7s, two 4s, two 6s, two 5s
  const FIXED_MULTISET = [1,1,9,9, 2,2,2,8,8,8, 3,3,7,7, 4,4,6,6, 5,5];

  // Angle-matching mechanic (levels 1-4): each pair gets a rotation angle from
  // just 3 options — clockwise 13°, normal, or anti-clockwise 13°. Duplicate
  // digit groups (e.g. the three 2-8 pairs) are assigned distinct angles within
  // their own group, so only the true partner shares your ball's exact angle.
  const FIXED_PAIRS = [[1,9],[2,8],[3,7],[4,6],[5,5],[6,4],[7,3],[2,8],[1,9],[2,8]];
  const ANGLE_OPTIONS = [23, -23]; // 23° clockwise, 23° anti-clockwise

  function buildPairAngles(){
    const typeCounters = {};
    return FIXED_PAIRS.map(pair => {
      const key = [...pair].sort((a, b) => a - b).join('-');
      const usedIdx = typeCounters[key] || 0;
      typeCounters[key] = usedIdx + 1;
      return ANGLE_OPTIONS[usedIdx % ANGLE_OPTIONS.length];
    });
  }

  let angles = []; // angles[idx] -> rotation angle assigned to the tile at that position (angle-mode levels only)
  let clearedOrig = []; // clearedOrig[idx] -> original value of a matched/cleared ball at that position, else null

  function levelConfig(lv){
    // All 30 levels use the angle-matching mechanic.
    // Levels 1-7:   angle only
    // Levels 8-15:  angle + blink
    // Levels 16-30: angle + moving positions
    const blink = (lv >= 8 && lv <= 15);
    const move = (lv >= 16 && lv <= 30);
    return {
      target: 10, min: 1, max: 9,
      tileCount: FIXED_MULTISET.length,
      nilCount: 0, rotation: 'none',
      blink: blink,
      move: move,
      moveMs: 1000,
      angleMode: true
    };
  }

  function findValidPair(arr, t){
    const pairs = [];
    for (let i = 0; i < arr.length; i++){
      if (arr[i] === null) continue;
      for (let j = i + 1; j < arr.length; j++){
        if (arr[j] === null) continue;
        if (arr[i] + arr[j] === t) pairs.push([i, j]);
      }
    }
    if (pairs.length === 0) return null;
    return pairs[randInt(0, pairs.length - 1)];
  }

  function generateBoard(t, mn, mx, tileCount, nilCount){
    const order = shuffledIndices(FIXED_MULTISET.length);
    return order.map(i => FIXED_MULTISET[i]);
  }

  function generateAngleBoard(){
    const pairAngles = buildPairAngles();
    const tiles = [];
    FIXED_PAIRS.forEach((pair, i) => {
      const angle = pairAngles[i];
      tiles.push({ value: pair[0], angle: angle });
      tiles.push({ value: pair[1], angle: angle });
    });
    const order = shuffledIndices(tiles.length);
    const shuffled = order.map(i => tiles[i]);
    return {
      values: shuffled.map(t => t.value),
      angles: shuffled.map(t => t.angle)
    };
  }

  function clearBlinkTimers(){
    blinkTimers.forEach(id => { clearTimeout(id); clearInterval(id); });
    blinkTimers = [];
  }

  function updateTimerDisplay(){
    const timerBadge = document.getElementById('timerBadge');
    if (timeLeft === null){
      timerBadge.textContent = '⏱ ∞';
      timerBadge.classList.remove('urgent');
      return;
    }
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    const display = mins > 0
      ? mins + ':' + String(secs).padStart(2, '0')
      : timeLeft + 's';
    timerBadge.textContent = '⏱ ' + display;
    timerBadge.classList.toggle('urgent', timeLeft <= 5);
  }

  function startCountdown(){
    clearInterval(countdownInterval);
    timeLeft = getTimeLimit(level);
    updateTimerDisplay();
    if (timeLeft === null) return; // no time limit on this level
    countdownInterval = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0){
        clearInterval(countdownInterval);
        handleTimeUp();
      }
    }, 1000);
  }

  function showLose(icon, message){
    clearInterval(countdownInterval);
    boardEl.querySelectorAll('.tile').forEach(t => t.style.pointerEvents = 'none');
    document.getElementById('loseIcon').textContent = icon;
    document.getElementById('loseSub').textContent = message;
    document.getElementById('loseOverlay').classList.add('show');
  }

  function handleTimeUp(){
    showLose('⏰', "Time ran out — try again!");
  }

  document.getElementById('loseReplayBtn').addEventListener('click', () => {
    document.getElementById('loseOverlay').classList.remove('show');
    startLevel(level);
  });

  function startLevel(lv){
    level = lv;
    const cfg = levelConfig(lv);
    target = cfg.target;
    min = cfg.min;
    max = cfg.max;
    if (cfg.angleMode){
      const board = generateAngleBoard();
      values = board.values;
      angles = board.angles;
    } else {
      values = generateBoard(target, min, max, cfg.tileCount, cfg.nilCount);
      angles = new Array(values.length).fill(0);
    }
    clearedOrig = new Array(values.length).fill(null);
    selected = [];
    locked = false;
    clearTimeout(hintTimeout);
    clearTimeout(autoAdvanceTimeout);
    clearInterval(moveInterval);
    moveInterval = null;
    clearBlinkTimers();
    saveProgress(level);
    startCountdown();

    levelNumEl.textContent = level;
    document.querySelector('.level-total').textContent = '/' + MAX_LEVEL;
    targetValueEl.textContent = target;
    hintTextEl.textContent = '\u00A0';
    overlayEl.classList.remove('show');
    document.getElementById('loseOverlay').classList.remove('show');
    renderPickSlots();
    overlayEl.querySelectorAll('.confetti').forEach(el => el.remove());

    renderBoard(cfg);
  }

  function rotationDegreeFor(mode, val){
    if (val === 6 || val === 7 || val === 9) return 0; // keep these upright to avoid misreads
    if (mode === '90') return 90;
    if (mode === 'mixed') return [0, 90, 180][randInt(0, 2)];
    return 0;
  }

  function renderBoard(cfg){
    boardEl.innerHTML = '';
    numSpans = [];
    const blinkCandidates = [];

    values.forEach((val, idx) => {
      const tile = document.createElement('div');
      const isNil = val === null;
      const colorClass = COLOR_CLASSES[idx % COLOR_CLASSES.length];
      tile.className = 'tile ' + (isNil ? 'nil' : colorClass);
      tile.dataset.idx = idx;
      tile.dataset.color = isNil ? 'nil' : colorClass;

      const ballFace = document.createElement('div');
      ballFace.className = 'ball-face';
      const angleModeLevel = (level >= 1 && level <= 4);
      if (angleModeLevel || (!isNil && (val === 7 || val === 6 || val === 9))){
        // keep upright — angle-mode levels need a clean, precise rotation with no
        // extra cosmetic tilt, and 6/7/9 always stay upright to avoid misreads
      } else {
        const tiltX = randInt(-20, 20);
        const tiltY = randInt(-20, 20);
        const tiltZ = randInt(-14, 14);
        ballFace.style.transform =
          'perspective(280px) rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg) rotate(' + tiltZ + 'deg)';
      }

      const ballNumber = document.createElement('div');
      ballNumber.className = 'ball-number';

      const numSpan = document.createElement('span');
      numSpan.className = 'num';
      numSpan.textContent = isNil ? '?' : val;
      if (!isNil){
        const deg = (level >= 1 && level <= 4) ? angles[idx] : rotationDegreeFor(cfg.rotation, val);
        if (deg !== 0) numSpan.style.transform = 'rotate(' + deg + 'deg)';
      }

      ballNumber.appendChild(numSpan);
      ballFace.appendChild(ballNumber);
      tile.appendChild(ballFace);

      tile.addEventListener('pointerdown', (e) => { e.preventDefault(); onTileClick(idx, tile); });
      boardEl.appendChild(tile);

      numSpans[idx] = numSpan;
      if (!isNil) blinkCandidates.push(numSpan);
    });

    if (cfg.blink){
      setupAlternatingBlink(blinkCandidates);
    }

    if (cfg.move){
      moveInterval = setInterval(() => {
        if (locked) return; // don't reshuffle while checking a pair
        shuffleValuesInPlace();
      }, cfg.moveMs);
    }
  }

  function shuffleValuesInPlace(){
    // Reshuffle every position (active AND already-cleared balls), except any
    // ball the player is currently holding mid-selection.
    const heldIndices = new Set(selected.map(s => s.idx));
    const allIndices = [];
    for (let i = 0; i < values.length; i++){
      if (!heldIndices.has(i)) allIndices.push(i);
    }
    if (allIndices.length < 2) return;

    const bundles = allIndices.map(i => ({
      cleared: clearedOrig[i] !== null,
      value: values[i],
      angle: angles[i],
      origVal: clearedOrig[i]
    }));

    for (let i = bundles.length - 1; i > 0; i--){
      const j = randInt(0, i);
      [bundles[i], bundles[j]] = [bundles[j], bundles[i]];
    }

    allIndices.forEach((idx, k) => {
      const b = bundles[k];
      const tileEl = boardEl.querySelector('.tile[data-idx="' + idx + '"]');

      if (b.cleared){
        values[idx] = null;
        clearedOrig[idx] = b.origVal;
        angles[idx] = b.angle;
        if (tileEl) tileEl.classList.add('cleared');
        if (numSpans[idx]){
          numSpans[idx].textContent = b.origVal;
          numSpans[idx].style.transform = 'rotate(180deg)';
        }
      } else {
        values[idx] = b.value;
        clearedOrig[idx] = null;
        angles[idx] = b.angle;
        if (tileEl) tileEl.classList.remove('cleared');
        if (numSpans[idx]){
          numSpans[idx].textContent = b.value;
          numSpans[idx].style.transform = b.angle !== 0 ? 'rotate(' + b.angle + 'deg)' : '';
        }
      }
    });
  }

  function setupAlternatingBlink(numSpans){
    const shuffled = shuffledIndices(numSpans.length).map(i => numSpans[i]);
    const half = Math.ceil(shuffled.length / 2);
    const groupA = shuffled.slice(0, half);
    const groupB = shuffled.slice(half);

    let phase = 0; // 0 = groupA hidden, groupB visible; 1 = the reverse
    function applyPhase(){
      groupA.forEach(el => el.classList.toggle('blink-hidden', phase === 0));
      groupB.forEach(el => el.classList.toggle('blink-hidden', phase === 1));
    }

    applyPhase();
    const id = setInterval(() => {
      phase = phase === 0 ? 1 : 0;
      applyPhase();
    }, 2000);
    blinkTimers.push(id);
  }

  function renderPickSlots(){
    const slots = [document.getElementById('pickSlot0'), document.getElementById('pickSlot1')];
    slots.forEach((slotEl, i) => {
      const pick = selected[i];
      slotEl.className = 'pick-slot';
      if (pick){
        const v = values[pick.idx];
        slotEl.textContent = v === null ? '?' : v;
        slotEl.classList.add('filled', pick.el.dataset.color);
        slotEl.style.cursor = 'pointer';
      } else {
        slotEl.textContent = '+';
        slotEl.style.cursor = 'default';
      }
    });
  }

  function deselectSlot(i){
    if (locked) return; // already evaluating a pair — too late to undo
    const pick = selected[i];
    if (!pick) return;
    pick.el.classList.remove('selected');
    selected.splice(i, 1);
    renderPickSlots();
  }

  document.getElementById('pickSlot0').addEventListener('click', () => deselectSlot(0));
  document.getElementById('pickSlot1').addEventListener('click', () => deselectSlot(1));

  let audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }

  function ensureAudioReady(callback){
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended'){
      ctx.resume().then(() => callback(ctx)).catch(() => {});
    } else {
      callback(ctx);
    }
  }

  function playTapSound(){
    try {
      ensureAudioReady((ctx) => {
        const now = ctx.currentTime;

        // "Piak piak" — two quick crisp slap/snap sounds
        [0, 0.11].forEach((delay) => {
          const t = now + delay;

          const bufferSize = Math.floor(ctx.sampleRate * 0.03);
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++){
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
          }
          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;

          const bandpass = ctx.createBiquadFilter();
          bandpass.type = 'bandpass';
          bandpass.frequency.value = 2600;
          bandpass.Q.value = 0.8;

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.5, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);

          noise.connect(bandpass);
          bandpass.connect(noiseGain);
          noiseGain.connect(ctx.destination);
          noise.start(t);

          const thump = ctx.createOscillator();
          const thumpGain = ctx.createGain();
          thump.type = 'sine';
          thump.frequency.setValueAtTime(220, t);
          thump.frequency.exponentialRampToValueAtTime(90, t + 0.04);
          thumpGain.gain.setValueAtTime(0.15, t);
          thumpGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
          thump.connect(thumpGain);
          thumpGain.connect(ctx.destination);
          thump.start(t);
          thump.stop(t + 0.06);
        });
      });
    } catch (e){ /* audio not available — fail silently */ }
  }

  function vibrateTap(){
    if (navigator.vibrate){
      try { navigator.vibrate(60); } catch (e){ /* not supported */ }
    }
  }

  function onTileClick(idx, tileEl){
    if (locked) return;
    if (values[idx] === null) return; // already matched and cleared
    if (selected.some(s => s.idx === idx)) return;

    playTapSound();
    vibrateTap();

    tileEl.classList.remove('hint');
    clearTimeout(hintTimeout);
    tileEl.classList.add('selected');
    selected.push({ idx, el: tileEl });
    renderPickSlots();

    if (selected.length === 2){
      locked = true;
      const v0 = values[selected[0].idx];
      const v1 = values[selected[1].idx];
      const sum = v0 + v1;
      const isBomb = (level >= 1 && level <= 4) && sum === target &&
        angles[selected[0].idx] !== angles[selected[1].idx];

      if (isBomb){
        selected.forEach(s => s.el.classList.add('wrong'));
        hintTextEl.textContent = 'Right numbers, wrong angle — try again!';
        setTimeout(() => {
          selected.forEach(s => {
            s.el.classList.remove('selected', 'wrong');
          });
          selected = [];
          locked = false;
          renderPickSlots();
        }, 320);
        return;
      }

      if (sum === target){
        selected.forEach(s => s.el.classList.add('correct'));
        const clearedThisRound = selected.slice();
        clearedThisRound.forEach(s => { s.origVal = values[s.idx]; values[s.idx] = null; clearedOrig[s.idx] = s.origVal; });
        hintTextEl.textContent = '\u00A0';

        setTimeout(() => {
          clearedThisRound.forEach(s => {
            s.el.classList.remove('correct');
            s.el.classList.add('cleared');
            if (numSpans[s.idx]){
              numSpans[s.idx].textContent = s.origVal;
              numSpans[s.idx].style.transform = 'rotate(180deg)';
            }
          });
          selected = [];
          locked = false;
          renderPickSlots();

          const remaining = values.filter(v => v !== null).length;
          if (remaining === 0){
            clearInterval(countdownInterval);
            setTimeout(() => showWin(), 350);
          } else {
            hintTextEl.textContent = (remaining / 2) + ' pair' + (remaining === 2 ? '' : 's') + ' left!';
          }
        }, 280);
      } else {
        selected.forEach(s => s.el.classList.add('wrong'));
        hintTextEl.textContent = 'That adds up to ' + sum + ', not ' + target + '. Try again!';
        setTimeout(() => {
          selected.forEach(s => {
            s.el.classList.remove('selected', 'wrong');
          });
          selected = [];
          locked = false;
          renderPickSlots();
        }, 320);
      }
    }
  }

  function onHintClick(){
    if (locked) return;
    const pair = findValidPair(values, target);
    if (!pair) return;

    boardEl.querySelectorAll('.tile').forEach(t => t.classList.remove('hint'));
    clearTimeout(hintTimeout);

    pair.forEach(i => {
      const el = boardEl.querySelector('.tile[data-idx="' + i + '"]');
      if (el) el.classList.add('hint');
    });

    hintTimeout = setTimeout(() => {
      pair.forEach(i => {
        const el = boardEl.querySelector('.tile[data-idx="' + i + '"]');
        if (el) el.classList.remove('hint');
      });
    }, 2500);
  }

  function spawnParticles(theme){
    const emojiFor = () => theme.particles[randInt(0, theme.particles.length - 1)];

    if (theme.mode === 'burst'){
      const count = 32;
      for (let i = 0; i < count; i++){
        const el = document.createElement('div');
        el.className = 'confetti mode-burst';
        el.textContent = emojiFor();
        const baseAngle = (360 / count) * i;
        const angle = (baseAngle + randInt(-10, 10)) * (Math.PI / 180);
        const distance = randInt(130, 260);
        el.style.setProperty('--bx', (Math.cos(angle) * distance).toFixed(1) + 'px');
        el.style.setProperty('--by', (Math.sin(angle) * distance).toFixed(1) + 'px');
        el.style.animationDuration = (1.3 + Math.random() * 0.9).toFixed(2) + 's';
        el.style.animationDelay = (Math.random() * 0.35).toFixed(2) + 's';
        el.style.fontSize = (34 + randInt(0, 26)) + 'px';
        overlayEl.appendChild(el);
      }
      return;
    }

    if (theme.mode === 'candy'){
      for (let i = 0; i < 40; i++){
        const fromTop = Math.random() < 0.5;
        const el = document.createElement('div');
        el.className = 'confetti mode-candy';
        el.textContent = emojiFor();
        el.style.left = randInt(0, 100) + 'vw';
        el.style.top = '50%';
        // startY: how far above (negative) or below (positive) the middle this piece begins
        const startY = fromTop ? -randInt(45, 60) : randInt(45, 60);
        el.style.setProperty('--startY', startY + 'vh');
        el.style.animationDuration = (2.2 + Math.random() * 1.4).toFixed(2) + 's';
        el.style.animationDelay = (Math.random() * 0.6).toFixed(2) + 's';
        el.style.fontSize = (40 + randInt(0, 30)) + 'px';
        overlayEl.appendChild(el);
      }
      return;
    }

    if (theme.mode === 'twinkle'){
      for (let i = 0; i < 34; i++){
        const el = document.createElement('div');
        el.className = 'confetti mode-twinkle';
        el.textContent = emojiFor();
        el.style.left = randInt(2, 96) + 'vw';
        el.style.top = randInt(6, 90) + '%';
        el.style.animationDuration = (1 + Math.random() * 1.4).toFixed(2) + 's';
        el.style.animationDelay = (Math.random() * 2.2).toFixed(2) + 's';
        el.style.fontSize = (18 + randInt(0, 22)) + 'px';
        overlayEl.appendChild(el);
      }
      for (let i = 0; i < 2; i++){
        const star = document.createElement('div');
        star.className = 'shooting-star';
        star.style.left = randInt(5, 40) + 'vw';
        star.style.top = randInt(5, 30) + '%';
        star.style.animationDuration = (0.7 + Math.random() * 0.4).toFixed(2) + 's';
        star.style.animationDelay = (0.4 + Math.random() * 1.6).toFixed(2) + 's';
        overlayEl.appendChild(star);
      }
      return;
    }

    if (theme.mode === 'fireworks'){
      const burstCount = 5;
      for (let b = 0; b < burstCount; b++){
        const originX = randInt(12, 88) + 'vw';
        const originY = randInt(10, 42) + '%';
        const baseDelay = (b * 0.28 + Math.random() * 0.15).toFixed(2);
        const sparkCount = 10;
        for (let i = 0; i < sparkCount; i++){
          const el = document.createElement('div');
          el.className = 'confetti mode-burst';
          el.textContent = emojiFor();
          el.style.left = originX;
          el.style.top = originY;
          const angle = (i * (360 / sparkCount) + randInt(-8, 8)) * (Math.PI / 180);
          const distance = randInt(50, 110);
          el.style.setProperty('--bx', (Math.cos(angle) * distance).toFixed(1) + 'px');
          el.style.setProperty('--by', (Math.sin(angle) * distance).toFixed(1) + 'px');
          el.style.animationDuration = (0.7 + Math.random() * 0.4).toFixed(2) + 's';
          el.style.animationDelay = baseDelay + 's';
          el.style.fontSize = (18 + randInt(0, 14)) + 'px';
          overlayEl.appendChild(el);
        }
      }
      return;
    }

    if (theme.mode === 'fly'){
      // a handful of plain birds gliding across
      for (let i = 0; i < 5; i++){
        const el = document.createElement('div');
        el.className = 'confetti mode-fly';
        el.textContent = '🕊️';
        el.style.left = '-15vw';
        el.style.top = randInt(12, 62) + '%';
        el.style.animationDuration = (1.8 + Math.random() * 1.4).toFixed(2) + 's';
        el.style.animationDelay = (Math.random() * 1.2).toFixed(2) + 's';
        el.style.fontSize = (24 + randInt(0, 16)) + 'px';
        overlayEl.appendChild(el);
      }

      // 3 eagles that stay put and blink, spread across the upper sky
      const eaglePositions = [
        { left: randInt(8, 24), top: randInt(10, 24) },
        { left: randInt(42, 58), top: randInt(8, 20) },
        { left: randInt(74, 90), top: randInt(14, 28) }
      ];
      eaglePositions.forEach((pos, i) => {
        const el = document.createElement('div');
        el.className = 'confetti mode-static-blink';
        el.textContent = '🦅';
        el.style.left = pos.left + 'vw';
        el.style.top = pos.top + '%';
        el.style.animationDuration = '2.6s';
        el.style.animationDelay = (i * 0.15).toFixed(2) + 's';
        el.style.fontSize = '40px';
        overlayEl.appendChild(el);
      });
      return;
    }

    if (theme.mode === 'floatup'){
      for (let i = 0; i < 30; i++){
        const el = document.createElement('div');
        el.className = 'confetti mode-floatup';
        el.textContent = emojiFor();
        el.style.left = randInt(0, 100) + 'vw';
        el.style.top = randInt(60, 95) + '%';
        el.style.animationDuration = (2 + Math.random() * 1.4).toFixed(2) + 's';
        el.style.animationDelay = (Math.random() * 0.7).toFixed(2) + 's';
        el.style.fontSize = (26 + randInt(0, 26)) + 'px';
        overlayEl.appendChild(el);
      }
      return;
    }
  }

  function playWinSound(){
    try {
      ensureAudioReady((ctx) => {
        const now = ctx.currentTime;

        // Cheerful applause — built from lots of tiny randomized "clap" bursts
        const clapDuration = 2.0;
        const length = Math.floor(ctx.sampleRate * clapDuration);
        const applauseBuffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const applauseData = applauseBuffer.getChannelData(0);

        const clapCount = 160;
        for (let c = 0; c < clapCount; c++){
          const startFrac = Math.random();
          const startSample = Math.floor(startFrac * length * 0.92);
          const clapLen = Math.floor(ctx.sampleRate * (0.008 + Math.random() * 0.02));
          const clapAmp = 0.5 + Math.random() * 0.5;
          for (let i = 0; i < clapLen; i++){
            const idx = startSample + i;
            if (idx >= length) break;
            const decay = Math.pow(1 - i / clapLen, 2);
            applauseData[idx] += (Math.random() * 2 - 1) * decay * clapAmp;
          }
        }
        let maxVal = 0;
        for (let i = 0; i < length; i++){ maxVal = Math.max(maxVal, Math.abs(applauseData[i])); }
        if (maxVal > 0){
          for (let i = 0; i < length; i++){ applauseData[i] = applauseData[i] / maxVal * 0.9; }
        }

        const applauseSource = ctx.createBufferSource();
        applauseSource.buffer = applauseBuffer;
        const applauseFilter = ctx.createBiquadFilter();
        applauseFilter.type = 'bandpass';
        applauseFilter.frequency.value = 3200;
        applauseFilter.Q.value = 0.6;
        const applauseGain = ctx.createGain();
        applauseGain.gain.setValueAtTime(0.0001, now);
        applauseGain.gain.linearRampToValueAtTime(0.85, now + 0.15);
        applauseGain.gain.setValueAtTime(0.85, now + clapDuration * 0.7);
        applauseGain.gain.linearRampToValueAtTime(0.0001, now + clapDuration);

        applauseSource.connect(applauseFilter);
        applauseFilter.connect(applauseGain);
        applauseGain.connect(ctx.destination);
        applauseSource.start(now);
        applauseSource.stop(now + clapDuration + 0.05);

        // Gentle "whoo!" crowd-cheer voices layered under the claps for extra warmth
        [
          { start: 0.05, base: 340, peak: 620, gain: 0.26 },
          { start: 0.18, base: 300, peak: 560, gain: 0.22 },
          { start: 0.35, base: 380, peak: 680, gain: 0.20 },
          { start: 0.5,  base: 420, peak: 740, gain: 0.18 }
        ].forEach(v => {
          const t = now + v.start;
          const whoo = ctx.createOscillator();
          const whooGain = ctx.createGain();
          const whooFilter = ctx.createBiquadFilter();
          whooFilter.type = 'lowpass';
          whooFilter.frequency.value = 1800;
          whoo.type = 'triangle';
          whoo.frequency.setValueAtTime(v.base, t);
          whoo.frequency.linearRampToValueAtTime(v.peak, t + 0.35);
          whoo.frequency.linearRampToValueAtTime(v.peak * 0.85, t + 1.1);
          whooGain.gain.setValueAtTime(0.0001, t);
          whooGain.gain.linearRampToValueAtTime(v.gain, t + 0.15);
          whooGain.gain.setValueAtTime(v.gain, t + 0.8);
          whooGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
          whoo.connect(whooFilter);
          whooFilter.connect(whooGain);
          whooGain.connect(ctx.destination);
          whoo.start(t);
          whoo.stop(t + 1.35);
        });

        // Cheerful ascending fanfare — like a little "ta-da!" (comes in over the applause)
        const fanfareStart = 0.5;
        const notes = [
          { freq: 523.25, t: fanfareStart,        dur: 0.16, gain: 0.4 }, // C5
          { freq: 659.25, t: fanfareStart + 0.11,  dur: 0.16, gain: 0.4 }, // E5
          { freq: 783.99, t: fanfareStart + 0.22,  dur: 0.16, gain: 0.4 }, // G5
          { freq: 1046.5, t: fanfareStart + 0.33,  dur: 0.45, gain: 0.5 }  // C6 (held, triumphant)
        ];

        notes.forEach(n => {
          const t = now + n.t;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.freq, t);

          const sparkle = ctx.createOscillator();
          const sparkleGain = ctx.createGain();
          sparkle.type = 'sine';
          sparkle.frequency.setValueAtTime(n.freq * 2, t);
          sparkleGain.gain.setValueAtTime(n.gain * 0.3, t);
          sparkleGain.gain.exponentialRampToValueAtTime(0.0001, t + n.dur);

          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(n.gain, t + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + n.dur);

          osc.connect(gain);
          gain.connect(ctx.destination);
          sparkle.connect(sparkleGain);
          sparkleGain.connect(ctx.destination);

          osc.start(t);
          osc.stop(t + n.dur + 0.02);
          sparkle.start(t);
          sparkle.stop(t + n.dur + 0.02);
        });
      });
    } catch (e){ /* audio not available — fail silently */ }
  }

  function showWin(){
    clearBlinkTimers();
    clearInterval(moveInterval);
    moveInterval = null;
    playWinSound();

    const playAgainBtn = document.getElementById('playAgainBtn');

    if (level >= MAX_LEVEL){
      // Final victory screen — the grand finale
      overlayEl.style.background = 'radial-gradient(circle at 50% 30%, #FFFCEB 0%, #FFD23F 20%, #FF8F1F 45%, #FF3D7A 72%, #6A1EC2 100%)';
      overlayEl.querySelectorAll('.confetti, .shooting-star').forEach(el => el.remove());

      const centralIconEl = document.getElementById('centralIcon');
      centralIconEl.className = 'central-icon finale-crown';
      centralIconEl.innerHTML = CROWN_SVG;

      const topIconsEl = document.getElementById('topIcons');
      topIconsEl.style.display = 'none';

      overlayBigEl.textContent = 'CONGRATULATIONS!';
      overlayBigEl.classList.add('finale');
      overlayBigEl.style.color = '';
      overlaySubEl.innerHTML = "You are GOD's Masterpiece<span class=\"ref\">Ephesians 2:10</span>";

      overlayEl.classList.add('show');

      // Layered celebration: sparkling burst + rising sparkles/hearts + falling candy, all at once
      // Keeping the finale clean — just the crown and text, no extra particles

      return;
    }

    overlayBigEl.classList.remove('finale');

    playAgainBtn.style.display = 'none';
    document.getElementById('topIcons').style.display = '';

    const theme = THEMES[(level - 1) % THEMES.length];

    overlayEl.style.background = theme.bg;
    overlayEl.querySelectorAll('.confetti, .shooting-star').forEach(el => el.remove());

    const centralIconEl = document.getElementById('centralIcon');
    centralIconEl.className = 'central-icon' + (theme.iconClass ? ' ' + theme.iconClass : '');
    if (theme.iconHTML){
      centralIconEl.innerHTML = theme.iconHTML;
    } else {
      centralIconEl.textContent = theme.icon || '';
    }

    const topIconsEl = document.getElementById('topIcons');
    const spans = topIconsEl.querySelectorAll('span');
    theme.topIcons.forEach((emoji, i) => { if (spans[i]) spans[i].textContent = emoji; });

    overlayBigEl.textContent = PRAISE[randInt(0, PRAISE.length - 1)];
    overlayBigEl.style.color = theme.textColor;
    const blessing = BLESSINGS[randInt(0, BLESSINGS.length - 1)];
    overlaySubEl.innerHTML = blessing.text + '<span class="ref">' + blessing.ref + '</span>';

    overlayEl.classList.add('show');
    spawnParticles(theme);

    autoAdvanceTimeout = setTimeout(() => {
      startLevel(level + 1);
    }, 3000);
  }

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    startLevel(1);
  });


  const params = new URLSearchParams(location.search);
  if (params.get('finale') === '1'){
    startLevel(1);
    level = MAX_LEVEL;
    showWin();
  } else {
    startLevel(loadProgress());
  }
})();
